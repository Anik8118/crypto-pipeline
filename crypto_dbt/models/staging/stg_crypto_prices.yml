version: 2

models:
  - name: stg_crypto_prices
    columns:
      - name: coin
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['bitcoin', 'ethereum', 'solana']
      - name: price_usd
        data_tests:
          - not_null
      - name: price_time
        data_tests:
          - not_null